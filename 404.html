<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404 - Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="404.css">
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: #111;
  color: white;
}

/* 404 SECTION */
.error-page {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

/* CONTENT */
.error-content {
  max-width: 500px;
  animation: fadeUp 1.2s ease;
}

.error-content h1 {
  font-size: 120px;
  font-weight: bold;
  letter-spacing: 8px;
}

.error-content h2 {
  font-size: 28px;
  margin-bottom: 15px;
}

.error-content p {
  font-size: 15px;
  line-height: 1.7;
  color: #ccc;
  margin-bottom: 30px;
}

/* BUTTON */
.btn {
  display: inline-block;
  padding: 14px 40px;
  background: white;
  color: black;
  text-decoration: none;
  font-size: 14px;
  letter-spacing: 2px;
  transition: 0.4s;
}

.btn:hover {
  background: #f4c10f;
  transform: translateY(-3px);
}

/* ANIMATION */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(40px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* RESPONSIVE */
@media(max-width: 600px) {
  .error-content h1 {
    font-size: 80px;
  }

  .error-content h2 {
    font-size: 22px;
  }
}

  </style>
</head>
<body>

<section class="error-page">
  <div class="error-content">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>
      The page you are looking for might have been removed,
      had its name changed, or is temporarily unavailable.
    </p>
    <a href="index.html" class="btn">Back to Home</a>
  </div>
</section>

</body>
</html>
